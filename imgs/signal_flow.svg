<svg width="680" height="600" viewBox="0 0 680 600" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Signal flow of the N64 to GameCube CPLD adapter</title>
<desc>An N64 controller connects to the CPLD's N64 receiver FSM, which decodes JoyBus bits into a button and stick state register. The stick coordinate map applies per-game analog correction, then the GameCube transmitter FSM drives the JoyBus response to the Wii's GameCube port.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
.title { font-size: 14px; font-weight: 600; }
.sub { font-size: 12px; font-weight: 400; }
.gray-box { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 1; }
.gray-title { fill: #2C2C2A; }
.gray-sub { fill: #5F5E5A; }
.teal-box { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 1; }
.teal-title { fill: #04342C; }
.teal-sub { fill: #0F6E56; }
.arrow { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- Box 1: N64 controller -->
<rect class="gray-box" x="180" y="40" width="320" height="56" rx="8"/>
<text class="title gray-title" x="340" y="62" text-anchor="middle" dominant-baseline="central">N64 controller</text>
<text class="sub gray-sub" x="340" y="80" text-anchor="middle" dominant-baseline="central">JoyBus single-wire input</text>

<line class="arrow" x1="340" y1="96" x2="340" y2="136" marker-end="url(#arrow)"/>

<!-- Box 2: N64 RX FSM -->
<rect class="teal-box" x="180" y="136" width="320" height="56" rx="8"/>
<text class="title teal-title" x="340" y="158" text-anchor="middle" dominant-baseline="central">CPLD N64 RX FSM</text>
<text class="sub teal-sub" x="340" y="176" text-anchor="middle" dominant-baseline="central">Decodes JoyBus bits from the N64</text>

<line class="arrow" x1="340" y1="192" x2="340" y2="232" marker-end="url(#arrow)"/>

<!-- Box 3: Button/stick state -->
<rect class="teal-box" x="180" y="232" width="320" height="56" rx="8"/>
<text class="title teal-title" x="340" y="254" text-anchor="middle" dominant-baseline="central">Button / stick state</text>
<text class="sub teal-sub" x="340" y="272" text-anchor="middle" dominant-baseline="central">Latched button and axis registers</text>

<line class="arrow" x1="340" y1="288" x2="340" y2="328" marker-end="url(#arrow)"/>

<!-- Box 4: Stick coordinate map -->
<rect class="teal-box" x="180" y="328" width="320" height="56" rx="8"/>
<text class="title teal-title" x="340" y="350" text-anchor="middle" dominant-baseline="central">Stick coordinate map</text>
<text class="sub teal-sub" x="340" y="368" text-anchor="middle" dominant-baseline="central">Per-game analog correction</text>

<line class="arrow" x1="340" y1="384" x2="340" y2="424" marker-end="url(#arrow)"/>

<!-- Box 5: GC TX FSM -->
<rect class="teal-box" x="180" y="424" width="320" height="56" rx="8"/>
<text class="title teal-title" x="340" y="446" text-anchor="middle" dominant-baseline="central">CPLD GC TX FSM</text>
<text class="sub teal-sub" x="340" y="464" text-anchor="middle" dominant-baseline="central">Drives the JoyBus response to the Wii</text>

<line class="arrow" x1="340" y1="480" x2="340" y2="520" marker-end="url(#arrow)"/>

<!-- Box 6: Wii GameCube port -->
<rect class="gray-box" x="180" y="520" width="320" height="56" rx="8"/>
<text class="title gray-title" x="340" y="542" text-anchor="middle" dominant-baseline="central">Wii GameCube port</text>
<text class="sub gray-sub" x="340" y="560" text-anchor="middle" dominant-baseline="central">Receives the GameCube JoyBus output</text>

</svg>
